[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    {name = "Atharv Amar Umap", email = "aumap@terpmail.umd.edu"},
    {name = "Caroline J. Charpentier"},
    {name = "Valentin Guigon", email = "vguigon@umd.edu"}
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development"
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>0.15.0",
    "rich",
    "reportlab",
    "pdfrw",
    "matplotlib"
]
description = "Trial-aware neurodesign-plus 2.0 for fMRI experimental design optimisation"
license = {text = "MIT"}
maintainers = [
    {name = "Atharv Amar Umap", email = "aumap@terpmail.umd.edu"},
    {name = "Valentin Guigon", email = "vguigon@umd.edu"}
]
name = "neurodesign-plus"
readme = "README.md"
requires-python = ">=3.9"
version = "2.0.0"

[project.optional-dependencies]
dev = [
    "neurodesign-plus[doc,test]",
    "pre-commit",
    "tox"
]
doc = [
    "sphinx>=7.0",
    "sphinx-copybutton",
    "furo",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints"
]
test = [
    "coverage",
    "nbclient",
    "nbformat",
    "pytest>=6.0.0",
    "pytest-cov",
    "nbmake",
    "pymupdf"
]

[project.urls]
"Bug Tracker" = "https://github.com/SLDlab/neurodesign-plus/issues"
Changelog = "https://github.com/SLDlab/neurodesign-plus/blob/master/CHANGES.md"
Documentation = "https://neurodesign-plus.readthedocs.io"
Homepage = "https://github.com/SLDlab/neurodesign-plus"
Repository = "https://github.com/SLDlab/neurodesign-plus"

[tool.black]
line-length = 90

[tool.codespell]
ignore-words = ".github/codespell_ignore_words.txt"
skip = "*.ipynb"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.suplex",
    "/.venv",
    "/.pytest_cache",
    "/docs/_build",
    "/manuscript",
    "/output",
    "/tests",
    "/tutorials",
    "/validation",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/SUPLEX.md"
]

[tool.hatch.build.targets.wheel]
packages = ["neurodesign"]

[tool.isort]
combine_as_imports = true
line_length = 90
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --doctest-modules --showlocals -s -vv --durations=0"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
junit_family = "xunit2"
minversion = "6.0"
norecursedirs = [".tmp_precommit", "validation/_artifacts", "tests/legacy", "neurodesign-original"]
xfail_strict = true
