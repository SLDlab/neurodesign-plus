---
name: tests

on:
    push:
        branches:
        -   master
    pull_request:
        branches:
        -   '*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Test with ${{ matrix.py }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                py: ['3.13', '3.12', '3.11', '3.10', '3.9']
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
        -   name: Checkout
            uses: actions/checkout@v5
        -   name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: ${{ matrix.py }}
                allow-prereleases: true
        -   name: Install tox
            run: python -m pip install --upgrade tox
        -   name: Run tests
            run: tox run -e tests
        -   name: Upload coverage to CodeCov
            uses: codecov/codecov-action@v5
            with:
                flags: ${{ matrix.os }}_${{ matrix.py }}
            if: success()

    notebooks:
        name: Execute notebooks
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v5
        -   name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'
        -   name: Install tox
            run: python -m pip install --upgrade tox
        -   name: Execute tutorial notebooks
            run: tox run -e test_notebooks

    docs:
        name: Build docs
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v5
        -   name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'
        -   name: Install tox
            run: python -m pip install --upgrade tox
        -   name: Build documentation
            run: tox run -e docs

    validation:
        name: Aggregate validation
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v5
        -   name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'
        -   name: Install validation dependencies
            run: python -m pip install ".[doc,test]"
        -   name: Run aggregate validation
            run: python -m validation.run_all_validation_workflows
